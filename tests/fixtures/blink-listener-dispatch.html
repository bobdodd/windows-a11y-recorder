<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blink listener and dispatch fixture</title>
</head>
<body>
  <h1>Blink listener and dispatch fixture</h1>
  <p id="status" aria-live="polite">Preparing fixture.</p>
  <div id="propagation-root">
    <div id="pointer-only">Pointer-only activation target</div>
  </div>
  <a id="default-action-link" href="#default-action-result">
    Default-action target
  </a>
  <div id="default-action-result">Default-action destination</div>
  <div id="attribute-evidence">
    <button
      id="disclosure"
      aria-expanded="false"
      aria-label="Fixture disclosure"
      aria-labelledby="disclosure-name-one"
    >Toggle</button>
    <span id="disclosure-name-one">First disclosure name</span>
    <span id="disclosure-name-two">Second disclosure name</span>
    <p
      id="live-region"
      aria-live="polite"
      data-removable="present"
    >Live region before.</p>
  </div>
  <iframe
    id="identity-subframe"
    src="blink-subframe.html"
    title="Navigation identity child frame"
  ></iframe>
  <script>
    const target = document.getElementById("pointer-only");
    const propagationRoot = document.getElementById("propagation-root");
    const defaultActionLink = document.getElementById("default-action-link");
    const status = document.getElementById("status");
    const invocationOrder = [];

    document.addEventListener("visibilitychange", () => {
      if (
        document.visibilityState === "hidden" &&
        status.dataset.hiddenTimeoutScheduled !== "true"
      ) {
        status.dataset.hiddenTimeoutScheduled = "true";
        window.setTimeout(() => {
          status.dataset.hiddenTimeoutFired = document.visibilityState;
        }, 25);
      }
    });

    propagationRoot.addEventListener(
      "click",
      () => invocationOrder.push("root-capture"),
      true
    );

    propagationRoot.addEventListener(
      "click",
      () => invocationOrder.push("root-bubble"),
      false
    );

    function handleClick(event) {
      invocationOrder.push("target-primary");
      event.preventDefault();
      status.textContent = "Fixture click listener invoked.";
      target.removeEventListener("click", handleClick, false);
    }

    target.addEventListener("click", handleClick, {
      capture: false,
      passive: false,
      once: false
    });

    target.addEventListener("click", (event) => {
      invocationOrder.push("target-stop");
      event.stopPropagation();
      status.dataset.invocationOrder = invocationOrder.join(",");
    });

    status.textContent = "Fixture listener registered.";
    const cancelledAnimationFrameId = window.requestAnimationFrame(() => {
      status.dataset.cancelledAnimationFrameRan = "true";
    });
    window.cancelAnimationFrame(cancelledAnimationFrameId);
    window.requestAnimationFrame((timestamp) => {
      status.dataset.animationFrameTimestamp = String(timestamp);
      document.title = "Blink listener and dispatch fixture ready";
    });
    const cancelledIdleCallbackId = window.requestIdleCallback(() => {
      status.dataset.cancelledIdleCallbackRan = "true";
    }, { timeout: 5000 });
    window.cancelIdleCallback(cancelledIdleCallbackId);
    window.requestIdleCallback((deadline) => {
      status.dataset.idleCallbackDidTimeout = String(deadline.didTimeout);
    }, { timeout: 1 });
    const idleTimeoutDeadline = performance.now() + 100;
    while (performance.now() < idleTimeoutDeadline) {
      // Keep the main thread busy so the 1 ms idle callback times out.
    }
    let intervalTicks = 0;
    const intervalId = window.setInterval(() => {
      intervalTicks += 1;
      status.dataset.intervalTicks = String(intervalTicks);
      window.clearInterval(intervalId);
    }, 125);
    window.setTimeout(() => {
      status.dataset.lifecycleTimeoutFired = document.visibilityState;
    }, 3000);
    const lifecycleIntervalId = window.setInterval(() => {
      status.dataset.lifecycleIntervalRan = "true";
    }, 5000);
    window.setTimeout(() => {
      window.clearInterval(lifecycleIntervalId);
      status.dataset.lifecycleIntervalCancelled = document.visibilityState;
    }, 3500);
    window.setTimeout(() => {
      target.click();
      const mutationResult = document.createElement("div");
      mutationResult.id = "post-mutation-result";
      mutationResult.textContent = "Deterministic post-mutation checkpoint.";
      propagationRoot.appendChild(mutationResult);
      defaultActionLink.click();
      window.history.pushState(
        { fixture: "same-document" },
        "",
        "#same-document-navigation"
      );
      const disclosure = document.getElementById("disclosure");
      const liveRegion = document.getElementById("live-region");
      // Each mutation below has one known before and after value, so the
      // verifier can assert exact string equality rather than shape alone.
      disclosure.setAttribute("aria-expanded", "true");
      disclosure.setAttribute("aria-labelledby", "disclosure-name-two");
      disclosure.setAttribute("aria-label", "Fixture disclosure expanded");
      liveRegion.firstChild.data = "Live region after.";
      liveRegion.removeAttribute("data-removable");
      // Exercises the per-value length limit. The recorded value must be a
      // prefix of this value with the reported full length, not a dropped
      // record.
      disclosure.setAttribute("data-long-value", "A".repeat(5000));
    }, 250);
  </script>
</body>
</html>
