<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blink listener and dispatch fixture</title>
</head>
<body>
  <h1>Blink listener and dispatch fixture</h1>
  <p id="status" aria-live="polite">Preparing fixture.</p>
  <div id="propagation-root">
    <div id="pointer-only">Pointer-only activation target</div>
  </div>
  <a id="default-action-link" href="#default-action-result">
    Default-action target
  </a>
  <div id="default-action-result">Default-action destination</div>
  <script>
    const target = document.getElementById("pointer-only");
    const propagationRoot = document.getElementById("propagation-root");
    const defaultActionLink = document.getElementById("default-action-link");
    const status = document.getElementById("status");
    const invocationOrder = [];

    propagationRoot.addEventListener(
      "click",
      () => invocationOrder.push("root-capture"),
      true
    );

    propagationRoot.addEventListener(
      "click",
      () => invocationOrder.push("root-bubble"),
      false
    );

    function handleClick(event) {
      invocationOrder.push("target-primary");
      event.preventDefault();
      status.textContent = "Fixture click listener invoked.";
      target.removeEventListener("click", handleClick, false);
    }

    target.addEventListener("click", handleClick, {
      capture: false,
      passive: false,
      once: false
    });

    target.addEventListener("click", (event) => {
      invocationOrder.push("target-stop");
      event.stopPropagation();
      status.dataset.invocationOrder = invocationOrder.join(",");
    });

    status.textContent = "Fixture listener registered.";
    window.setTimeout(() => {
      target.click();
      defaultActionLink.click();
    }, 250);
  </script>
</body>
</html>
