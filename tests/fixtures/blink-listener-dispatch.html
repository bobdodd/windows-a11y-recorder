<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blink listener and dispatch fixture</title>
</head>
<body>
  <h1>Blink listener and dispatch fixture</h1>
  <p id="status" aria-live="polite">Preparing fixture.</p>
  <div id="propagation-root">
    <div id="pointer-only">Pointer-only activation target</div>
  </div>
  <a id="default-action-link" href="#default-action-result">
    Default-action target
  </a>
  <div id="default-action-result">Default-action destination</div>
  <div id="registration-form-evidence">
    <!-- Parsed as an inline content attribute, so Blink creates the listener
         from markup rather than from a script call. -->
    <button
      id="inline-handler"
      onclick="event.stopPropagation(); document.getElementById('status').dataset.inlineHandlerRan = 'true';"
    >Inline attribute handler</button>
    <button id="property-handler">Event handler property</button>
    <button id="external-script-handler">External script handler</button>
  </div>
  <!-- Loaded as a separate script so a recorded registration location reports
       that file rather than the document. -->
  <script src="blink-listener-registration.js"></script>
  <div id="attribute-evidence">
    <button
      id="disclosure"
      aria-expanded="false"
      aria-label="Fixture disclosure"
      aria-labelledby="disclosure-name-one"
    >Toggle</button>
    <span id="disclosure-name-one">First disclosure name</span>
    <span id="disclosure-name-two">Second disclosure name</span>
    <p
      id="live-region"
      aria-live="polite"
      data-removable="present"
    >Live region before.</p>
  </div>
  <iframe
    id="identity-subframe"
    src="blink-subframe.html"
    title="Navigation identity child frame"
  ></iframe>
  <script>
    const target = document.getElementById("pointer-only");
    const propagationRoot = document.getElementById("propagation-root");
    const defaultActionLink = document.getElementById("default-action-link");
    const status = document.getElementById("status");
    const invocationOrder = [];

    document.addEventListener("visibilitychange", () => {
      if (
        document.visibilityState === "hidden" &&
        status.dataset.hiddenTimeoutScheduled !== "true"
      ) {
        status.dataset.hiddenTimeoutScheduled = "true";
        window.setTimeout(() => {
          status.dataset.hiddenTimeoutFired = document.visibilityState;
        }, 25);
      }
    });

    propagationRoot.addEventListener(
      "click",
      () => invocationOrder.push("root-capture"),
      true
    );

    propagationRoot.addEventListener(
      "click",
      () => invocationOrder.push("root-bubble"),
      false
    );

    function handleClick(event) {
      invocationOrder.push("target-primary");
      event.preventDefault();
      status.textContent = "Fixture click listener invoked.";
      target.removeEventListener("click", handleClick, false);
    }

    target.addEventListener("click", handleClick, {
      capture: false,
      passive: false,
      once: false
    });

    target.addEventListener("click", (event) => {
      invocationOrder.push("target-stop");
      event.stopPropagation();
      status.dataset.invocationOrder = invocationOrder.join(",");
    });

    // Registered on the window, which is an EventTarget that is not a Node.
    // The pointer-only click stops propagation at its target, so the only
    // click that reaches the window is the default-action link click, and the
    // recorded window invocations are deterministic.
    const windowClickTargets = [];
    window.addEventListener(
      "click",
      (event) => {
        windowClickTargets.push(event.target.id);
        status.dataset.windowClickTargets = windowClickTargets.join(",");
      },
      false
    );

    // Registered and removed on the window so a non-Node removal is recorded.
    function handleWindowResize() {
      status.dataset.windowResizeSeen = "true";
    }

    window.addEventListener("resize", handleWindowResize, false);
    window.removeEventListener("resize", handleWindowResize, false);

    // Assigning an on-event property registers a listener through the same
    // internal path as addEventListener, so the recorded form has to come from
    // the listener Blink created rather than from the call site.
    const propertyHandler = document.getElementById("property-handler");
    propertyHandler.onclick = (event) => {
      event.stopPropagation();
      status.dataset.propertyHandlerRan = "first";
    };

    // Reassigning over an existing on-event registration replaces the callback
    // in place, so Blink reports neither an addition nor a removal. The second
    // assignment here replaces a property registration and the third replaces
    // the inline content attribute registration above.
    propertyHandler.onclick = (event) => {
      event.stopPropagation();
      status.dataset.propertyHandlerRan = "second";
    };

    const inlineHandler = document.getElementById("inline-handler");
    inlineHandler.onclick = (event) => {
      event.stopPropagation();
      status.dataset.inlineHandlerReplaced = "true";
    };

    status.textContent = "Fixture listener registered.";
    const cancelledAnimationFrameId = window.requestAnimationFrame(() => {
      status.dataset.cancelledAnimationFrameRan = "true";
    });
    window.cancelAnimationFrame(cancelledAnimationFrameId);
    window.requestAnimationFrame((timestamp) => {
      status.dataset.animationFrameTimestamp = String(timestamp);
      document.title = "Blink listener and dispatch fixture ready";
    });
    const cancelledIdleCallbackId = window.requestIdleCallback(() => {
      status.dataset.cancelledIdleCallbackRan = "true";
    }, { timeout: 5000 });
    window.cancelIdleCallback(cancelledIdleCallbackId);
    window.requestIdleCallback((deadline) => {
      status.dataset.idleCallbackDidTimeout = String(deadline.didTimeout);
    }, { timeout: 1 });
    const idleTimeoutDeadline = performance.now() + 100;
    while (performance.now() < idleTimeoutDeadline) {
      // Keep the main thread busy so the 1 ms idle callback times out.
    }
    let intervalTicks = 0;
    const intervalId = window.setInterval(() => {
      intervalTicks += 1;
      status.dataset.intervalTicks = String(intervalTicks);
      window.clearInterval(intervalId);
    }, 125);
    // The page-lifecycle timers are scheduled by the validation harness rather
    // than at parse time, because a page's visibility during load depends on
    // when its window is shown and is therefore not deterministic. The harness
    // brings the page to the front, waits for it to report visible, calls this
    // function, and only then hides the page, so the schedule is recorded while
    // visible and the callbacks enter while hidden.
    let lifecycleEvidenceScheduled = false;
    window.recorderScheduleLifecycleEvidence = () => {
      if (lifecycleEvidenceScheduled) {
        return "already-scheduled";
      }
      lifecycleEvidenceScheduled = true;
      const scheduleState = document.visibilityState;
      window.setTimeout(() => {
        status.dataset.lifecycleTimeoutFired = document.visibilityState;
      }, 3000);
      const lifecycleIntervalId = window.setInterval(() => {
        status.dataset.lifecycleIntervalRan = "true";
      }, 5000);
      window.setTimeout(() => {
        window.clearInterval(lifecycleIntervalId);
        status.dataset.lifecycleIntervalCancelled = document.visibilityState;
      }, 3500);
      status.dataset.lifecycleEvidenceScheduled = scheduleState;
      return scheduleState;
    };
    window.setTimeout(() => {
      target.click();
      propertyHandler.click();
      inlineHandler.click();
      document.getElementById("external-script-handler").click();
      const mutationResult = document.createElement("div");
      mutationResult.id = "post-mutation-result";
      mutationResult.textContent = "Deterministic post-mutation checkpoint.";
      propagationRoot.appendChild(mutationResult);
      defaultActionLink.click();
      window.history.pushState(
        { fixture: "same-document" },
        "",
        "#same-document-navigation"
      );
      const disclosure = document.getElementById("disclosure");
      const liveRegion = document.getElementById("live-region");
      // Each mutation below has one known before and after value, so the
      // verifier can assert exact string equality rather than shape alone.
      disclosure.setAttribute("aria-expanded", "true");
      disclosure.setAttribute("aria-labelledby", "disclosure-name-two");
      disclosure.setAttribute("aria-label", "Fixture disclosure expanded");
      liveRegion.firstChild.data = "Live region after.";
      liveRegion.removeAttribute("data-removable");
      // Exercises the per-value length limit. The recorded value must be a
      // prefix of this value with the reported full length, not a dropped
      // record.
      disclosure.setAttribute("data-long-value", "A".repeat(5000));
    }, 250);
  </script>
  <!-- The isolated-world registration target is declared after the document's
       own script so that adding it does not move any line the recorded source
       locations above refer to. Nothing in the document registers a listener on
       it, so a listener on it can only have come from the isolated world the
       validation script creates. -->
  <div id="isolated-world-target">Isolated-world registration target</div>
</body>
</html>
